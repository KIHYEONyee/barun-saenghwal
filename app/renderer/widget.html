<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>바른생활 위젯</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #w { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; cursor: grab; }
  #w:active { cursor: grabbing; }
  #art { width: var(--px, 120px); height: var(--px, 120px); }
  #dot { position: absolute; right: 12%; bottom: 8%; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; background: oklch(0.62 0.13 155); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  #dot.off { background: oklch(0.75 0.005 85); }
</style></head>
<body><div id="w"><div id="art"></div><span id="dot"></span></div>
<script src="critter.js"></script>
<script src="widget.js"></script>
</body></html>
